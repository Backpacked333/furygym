# Xcode project definition. Generate the project with:  cd apps/ios && xcodegen
# (brew install xcodegen). FuryCo.xcodeproj and FuryCo/Info.plist are generated, not committed.
name: FuryCo
options:
  bundleIdPrefix: com.furyco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Base.xcconfig is committed with placeholders; it pulls in your private Config.xcconfig if present.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
  FuryCore:
    path: Packages/FuryCore

targets:
  FuryCo:
    type: application
    platform: iOS
    sources:
      - path: FuryCo
        excludes: ["Info.plist"]
    dependencies:
      - package: Supabase
        product: Supabase
      - package: FuryCore
        product: FuryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: FuryCo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: FuryCo/Info.plist
      properties:
        CFBundleDisplayName: Fury Co.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # The app only talks HTTPS to Supabase, the Fury Co. web app and Stripe's hosted pages.
        ITSAppUsesNonExemptEncryption: false
        # furyco://checkout/success brings the athlete back from Stripe Checkout.
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [furyco]
        # Lets a debug build reach a Supabase stack running on the developer's Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Asked only when an athlete switches on "Add to calendar" while reserving a class.
        NSCalendarsWriteOnlyAccessUsageDescription: Fury Co. adds the classes you reserve to your calendar.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        WebBaseURL: $(WEB_BASE_URL)

  FuryCoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FuryCoTests]
    dependencies:
      - target: FuryCo
      - package: FuryCore
        product: FuryCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests

schemes:
  FuryCo:
    build:
      targets:
        FuryCo: all
        FuryCoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FuryCoTests]
    archive:
      config: Release
